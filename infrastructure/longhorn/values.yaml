# apps/longhorn/values.yaml
#
# Cluster layout this is tuned for:
#   pve A -> w-1  (spare disk, storage node), cp-3
#   pve B -> w-2  (spare disk, storage node), cp-2
#   pve C -> cp-1 (spare disk, storage node)   <-- control plane doubling as storage
#
# Three storage nodes, one per physical host. cp-1 participates because pve3
# has no RAM for a third worker. Its Longhorn disk MUST be the separate spare
# disk, never the root disk that etcd lives on.
#
# Every storage node needs, set declaratively via RKE2 node-label:
#   topology.kubernetes.io/zone=<pve host>
#   node.longhorn.io/create-default-disk=true
# and a disk formatted and mounted at /var/lib/longhorn-disks/disk0.

# First install need to disable first based on https://longhorn.io/docs/1.12.1/deploy/install/install-with-argocd/
preUpgradeChecker:
  jobEnabled: false
defaultSettings:
  # Only nodes carrying the create-default-disk label contribute storage.
  # Without this, Longhorn carves space out of every node's root disk —
  # which on cp-1 would mean sharing a spindle with etcd.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn-disks/disk0

  # 3 replicas across 3 physical hosts. Node-level spread is NOT sufficient
  # here: two VMs can share a Proxmox host and Longhorn cannot see that, so
  # zone anti-affinity carries the real guarantee. Both hard — a volume goes
  # Degraded rather than silently placing two replicas on one machine.
  defaultReplicaCount: 3
  replicaSoftAntiAffinity: false
  replicaZoneSoftAntiAffinity: false

  # --- etcd protection ------------------------------------------------------
  # cp-1 runs etcd and a Longhorn replica. Steady-state replica traffic is
  # light; rebuilds are the spike that can delay etcd heartbeats and trigger a
  # leader election. Cap the concurrency so a rebuild stays a trickle.
  concurrentReplicaRebuildPerNodeLimit: 1
  concurrentVolumeBackupRestorePerNodeLimit: 1
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  guaranteedInstanceManagerCPU: 12 # this unit is in percentage

  # With only 3 zones and no spare capacity, a dead host cannot be rebuilt
  # around — there is nowhere to put the replica. Wait out reboots rather than
  # thrashing the network trying to heal something that cannot heal.
  replicaReplenishmentWaitInterval: 1800
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

  # --- capacity -------------------------------------------------------------
  # No thin provisioning past real capacity. A full Longhorn disk fails rather
  # than degrades, and rebuilds need free space to work with.
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 15
  storageReservedPercentageForDefaultDisk: 10

  # Keep a replica local to the workload where possible. Matters more here than
  # usual: every write goes to all 3 replicas synchronously over gigabit.
  defaultDataLocality: best-effort

  orphanResourceAutoDeletion: "replica-data"
  autoCleanupSystemGeneratedSnapshot: true

  # Instance-manager and engine-image pods are scheduled by longhorn-manager,
  # not by a chart-templated spec, so they need tolerations declared here
  # rather than in the longhornManager block below.
  taintToleration: "node-role.kubernetes.io/control-plane=:NoSchedule;CriticalAddonsOnly=true:NoExecute"

  # Configure this before putting anything you care about on the cluster.
  # On 3 nodes with no spare capacity, replica count is a weaker guarantee than
  # it looks, and it does nothing at all against a mistaken kubectl delete.
  # backupTarget: nfs://192.168.29.10:/volume1/longhorn-backup
  # backupstorePollInterval: 300

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  # Retain: a deleted PVC leaves the data behind. Mildly annoying to clean up,
  # much better than discovering Delete was the default.
  reclaimPolicy: Retain

# Tolerations so Longhorn can run on cp-1. Harmless if your control planes are
# untainted today (RKE2 leaves them schedulable by default) — but the moment
# you add CriticalAddonsOnly as a hardening step, storage would silently stop
# working on pve3 without these.
longhornManager:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoExecute

longhornDriver:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoExecute

# Expose the UI through your own ingress/Gateway so auth lives in one place.
# The Longhorn UI has no authentication of its own.
ingress:
  enabled: false

longhornUI:
  replicas: 1

csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

# No csi.kubeletRootDir override needed — RKE2 uses the standard
# /var/lib/kubelet. That setting is a k3s requirement, not an RKE2 one.
