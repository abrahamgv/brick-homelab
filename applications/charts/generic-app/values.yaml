# Default values for generic-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# Plain environment variables passed straight through to the container.
# Any valid Kubernetes EnvVar entry works here (value or valueFrom).
env: []
  # - name: LOG_LEVEL
  #   value: info
  # - name: POD_NAME
  #   valueFrom:
  #     fieldRef:
  #       fieldPath: metadata.name

# Environment variables sourced from keys in a Secret (rendered as secretKeyRef).
# Create the Secret outside this chart (e.g. a SealedSecret) and reference it here.
secretEnv:
  # Secret used for every var below unless the var sets its own secretName.
  secretName: ""
  vars: []
    # - name: DATABASE_URL        # env var name
    #   key: database-url         # key inside the Secret (defaults to the env var name)
    # - name: API_TOKEN
    #   secretName: other-secret  # override the default Secret for this var
    #   optional: true            # do not fail the pod if the key is missing

# Load every key of a Secret or ConfigMap as environment variables.
envFrom: []
  # - secretRef:
  #     name: app-secrets
  # - configMapRef:
  #     name: app-config
  #   prefix: APP_

# CronJobs run alongside the app. Each entry needs a name, schedule and command.
# The image defaults to the main app image, and the pod inherits env, secretEnv
# and envFrom from above unless inheritEnv is set to false.
cronjobs: []
  # - name: cleanup
  #   schedule: "0 3 * * *"
  #   timeZone: "Europe/Amsterdam"
  #   command: ["python", "manage.py", "cleanup"]
  #   args: []
  #   image:                       # optional override, any field may be omitted
  #     repository: ghcr.io/example/tools
  #     tag: "1.2.3"
  #     pullPolicy: IfNotPresent
  #   inheritEnv: true
  #   env: []                      # extra plain env vars for this job only
  #   secretEnv:                   # extra secret-backed env vars for this job only
  #     secretName: ""             # defaults to the top-level secretEnv.secretName
  #     vars: []
  #   envFrom: []
  #   concurrencyPolicy: Forbid    # Allow | Forbid | Replace
  #   suspend: false
  #   startingDeadlineSeconds: 300
  #   successfulJobsHistoryLimit: 3
  #   failedJobsHistoryLimit: 1
  #   backoffLimit: 3
  #   activeDeadlineSeconds: 600
  #   ttlSecondsAfterFinished: 86400
  #   restartPolicy: OnFailure
  #   resources: {}
  #   volumes: []
  #   volumeMounts: []
  #   annotations: {}
  #   podAnnotations: {}

# Jobs that run BEFORE the app is installed or upgraded (helm.sh/hook: pre-install,pre-upgrade).
# Argo CD maps these to PreSync hooks. Typical use: database migrations.
# Each entry accepts the same fields as a cronjob entry except schedule and the
# cron-only history/concurrency options, plus the hook options shown below.
preHookJobs: []
  # - name: migrate
  #   command: ["python", "manage.py", "migrate", "--noinput"]
  #   weight: 0                                        # lower runs first
  #   deletePolicy: before-hook-creation,hook-succeeded
  #   hook: pre-install,pre-upgrade                    # override the hook events if needed
  #   backoffLimit: 0
  #   activeDeadlineSeconds: 600

# Jobs that run AFTER the app is installed or upgraded (helm.sh/hook: post-install,post-upgrade).
# Argo CD maps these to PostSync hooks. Typical use: cache warmup, smoke checks, notifications.
postHookJobs: []
  # - name: warm-cache
  #   command: ["curl", "-fsS", "http://my-app/warmup"]
  #   image:
  #     repository: curlimages/curl
  #     tag: "8.10.1"
  #   inheritEnv: false
  #   weight: 0
  #   deletePolicy: before-hook-creation,hook-succeeded

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
